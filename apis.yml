name: Tenfold
description: >-
  Tenfold (a LivePerson company) is a computer-telephony integration (CTI)
  platform — marketed as the "Customer Experience Cloud" — that connects phone
  systems and contact-center platforms with CRM and support systems. It surfaces
  the caller's CRM record on inbound and outbound calls, enables click-to-call,
  automatic call logging, call notes, and call recording, and connects leading
  CRMs (Salesforce, Microsoft Dynamics, ServiceNow, Oracle NetSuite, Zendesk,
  SugarCRM, Bullhorn) with major phone systems (Cisco, Avaya, Genesys, RingCentral,
  Webex Calling, 3CX, Mitel, and more). Its REST API originates and queries calls,
  controls recording, manages users and organizations, reads and writes CRM
  records, and returns call analytics, transcripts, and keyword extraction.
  Tenfold was acquired by LivePerson in October 2021.
